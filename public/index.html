<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Mobcode</title>
  <meta name="description" content="Mobile client for OpenCode — real model catalogue, sessions, workspace, and provider management." />
  <meta name="theme-color" content="#070b14" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mobcode" />
  <link rel="stylesheet" href="/app/css/app.css" />
  <noscript>
    <div style="font-family:system-ui;padding:40px 24px;text-align:center;">
      Mobcode is a dynamic client for the OpenCode agent and needs JavaScript enabled.
    </div>
  </noscript>
</head>
<body>
  <div id="app" class="app">
    <!-- top bar: brand · context · connection · profile -->
    <header class="topbar" id="topbar" hidden>
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="m8 7-4 5 4 5" /><path d="m16 7 4 5-4 5" />
          </svg>
        </div>
        <span class="name" id="topbar-title">Mobcode</span>
      </div>
      <div class="topbar-spacer"></div>
      <div id="topbar-actions"></div>
      <div class="conn-state" id="conn-state" role="status" title="Connection status">
        <span class="dot"></span><span class="lbl">offline</span>
      </div>
      <button class="icon-btn round" id="btn-profile" aria-label="Menu" title="Menu">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="6" r="0.6" /><circle cx="12" cy="12" r="0.6" /><circle cx="12" cy="18" r="0.6" />
          <path d="M12 4.8v2.4M12 10.8v2.4M12 16.8v2.4" stroke-width="1.4" />
        </svg>
      </button>
    </header>

    <!-- views mount here -->
    <main id="view" class="view"></main>

    <!-- bottom tab bar -->
    <nav class="tabbar" id="tabbar" hidden>
      <button class="tab" data-tab="home" aria-label="Home">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5 12 4.5 3 11.5V20h6v-5h6v5h6z" />
        </svg>
        <span>Home</span>
      </button>
      <button class="tab" data-tab="projects" aria-label="Projects">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
        <span>Projects</span>
      </button>
      <button class="tab" data-tab="activity" aria-label="Activity">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12h4l3-8 5 16 3-8h5" />
        </svg>
        <span>Activity</span>
      </button>
    </nav>

    <div id="sheet-root"></div>
    <div id="toast-root"></div>
    <div id="modal-root"></div>
    <div id="live-region" class="sr-only" aria-live="polite"></div>
  </div>

  <script type="module" src="/app/js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
